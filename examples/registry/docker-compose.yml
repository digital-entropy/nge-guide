x-logging: &logging
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
  pull_policy: always
  user: ${APP_UID:-1000}:${APP_GID:-1000}
  working_dir: /var/www
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./runtime/storage:/var/www/storage
    - ./runtime/bootstrap-cache:/var/www/bootstrap/cache
  networks: [backend]
  logging: *logging

services:
  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [frontend, backend]
    depends_on:
      core:
        condition: service_healthy
    logging: *logging

  core:
    <<: *app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  horizon:
    <<: *app
    init: true
    command: ["php", "artisan", "horizon"]
    depends_on:
      core: {condition: service_healthy}

  scheduler:
    <<: *app
    init: true
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      core: {condition: service_healthy}

  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-me}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

networks:
  frontend: {driver: bridge}
  backend: {driver: bridge}

volumes:
  postgres_data: {}
  mysql_data: {}
  redis_data: {}
